<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Vault Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230c1017'/%3E%3Cg fill='%2334d399'%3E%3Crect x='3' y='3' width='3' height='3'/%3E%3Crect x='10' y='3' width='3' height='3'/%3E%3Crect x='3' y='10' width='3' height='3'/%3E%3C/g%3E%3Crect x='10' y='10' width='3' height='3' fill='%23fbbf24'/%3E%3Crect x='6.5' y='6.5' width='3' height='3' fill='%2334d399'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<main class="login">
  <div class="brand login-brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="2" width="6" height="6" rx="1.2"/><rect x="9" y="2" width="6" height="6" rx="1.2"/>
      <rect x="16" y="2" width="6" height="6" rx="1.2"/><rect x="2" y="9" width="6" height="6" rx="1.2"/>
      <rect x="9" y="9" width="6" height="6" rx="1.2" class="core"/><rect x="16" y="9" width="6" height="6" rx="1.2"/>
      <rect x="2" y="16" width="6" height="6" rx="1.2"/><rect x="9" y="16" width="6" height="6" rx="1.2"/>
      <rect x="16" y="16" width="6" height="6" rx="1.2"/>
    </svg>
    <span class="brand-name">VAULT</span>
    <span class="brand-sub">console</span>
  </div>
  <form class="panel login-form" id="login-form" novalidate>
    <div class="panel-head">
      <h1>Sign in</h1>
      <p class="hint">The console shows the live state of a Vault cluster. Access requires an account.</p>
    </div>
    <label>Username<input name="username" autocomplete="username" required autofocus maxlength="64"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
